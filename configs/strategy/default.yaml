# Default research strategy config

data:
  mode: snapshot
  snapshot_path: data/processed/us_equities_snapshot.parquet
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  seed: 42
  max_ffill_days: 3
  tickers:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - TSLA
    - JPM
    - XOM
    - JNJ

factors:
  momentum_lookback: 252
  momentum_skip: 21
  mean_reversion_lookback: 21
  volatility_window: 63

research:
  train_size: 504
  test_size: 126
  holdout_size: 126
  top_n: 5
  rebalance_frequency: 21
  transaction_cost_bps: 10.0
  initial_capital: 1000000
  bootstrap_samples: 300
  bootstrap_ci_level: 0.95
  bootstrap_seed: 42
  benchmark:
    mode: spy
    ticker: SPY
    fallback: equal_weight
    fetch_if_missing: true
  liquidity_model:
    enabled: true
    commission_bps: 4.0
    half_spread_bps: 2.0
    slippage_bps: 8.0
    participation_cap: 0.10
    cap_breach_penalty_bps: 20.0
    impact_exponent: 0.50
    min_dollar_volume: 1.0
  nested_search:
    enabled: true
    selection_metric: mean_fold_sharpe
    space:
      momentum_lookback: [126, 252]
      mean_reversion_lookback: [10, 21]
      volatility_window: [42, 63]

run:
  output_root: artifacts/runs
